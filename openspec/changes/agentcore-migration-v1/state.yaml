open_questions: []

resolved_in_design:
  - Region us-east-1; model IDs amazon.nova-micro-v1:0 and amazon.titan-embed-text-v2:0 (1024 dims)
  - IaC is AWS CDK v2 Python only (L1 constructs); AgentCore starter toolkit rejected
  - Agent ships as a direct code deployment zip (PYTHON_3_12); no ECR, no Docker
  - DNS stays at DigitalOcean (CNAME); ACM cert in us-east-1, DNS validation manual; Route 53 not used
  - Knowledge Base sync is a manual scripts/sync_kb.py StartIngestionJob; re-index has no read outage
  - AgentCore Runtime has no standing idle fee, but idle memory bills at $0.00945/GB-hour
  - Response contract {answer, language}; runtimeSessionId = sha256("rt:" + session_id)
  - Estimated monthly cost approximately USD 0.65 at 1,000 questions/month

carried_risks:
  - >-
    Cold-session latency (approximately 6-12 s) exceeds the split p95 target
    of 10 s only in a worst case; warm requests are 1.2-2.0 s. Smoke test
    (task 9.3) must report warm and cold latency separately; escalate to the
    owner if the 10 s cold-start p95 proves unacceptable. Documented fallback
    is proposal Option C.
  - Nova Micro may require the us.amazon.nova-micro-v1:0 inference profile; verify before first deploy
  - Lambda must pin boto3/botocore (bundled version may lack the bedrock-agentcore client)
  - >-
    Review Workload Forecast in tasks.md shows High 400-line budget risk;
    chain strategy is not yet chosen (see blocked_reasons).

owner_confirmation_pending: []

owner_confirmed:
  - Split latency target: warm p95 < 3.5 s, first-request-of-session p95 < 10 s
  - Monthly cost ceiling USD 10
  - Coverage gate 85 % on src/, blocking in CI
  - Response shape: single-answer object {answer, language}; widget adapts
  - Manual content updates (S3 upload + KB sync) instead of an automated crawl

