    status: in_progress
    depends_on: [tasks]
    engram_topic_key: sdd/agentcore-migration-v1/apply-progress
    batches:
      - pr: PR0
        branch: chore/sdd-planning-artifacts
        scope: planning artifacts, LICENSE, .gitignore, legacy diagram
