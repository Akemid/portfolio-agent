        branch: feat/bootstrap-ci
        scope: Phase 1 bootstrap + CI
        status: merged
        pr_url: https://github.com/Akemid/portfolio-agent/pull/3
        note: >-
          Apply executor stalled after completing Phase 1 commits; orchestrator
          finished the spec latency alignment and persistence. Merged to main
          (merge commit c1dd4f1) before this PR2a batch started.
      - pr: PR2a
        branch: feat/domain-core-a
        base: main
        scope: >-
          Phase 2 first half — domain models (ChatRequest, AgentAnswer,
          Session, RateLimitDecision), domain errors, derive_key hashing,
          the five Protocol ports (SessionStore, RateLimiter, AgentClient,
          Clock, Ids), and the four in-memory test fakes.
        status: pr_open
        pr_url: https://github.com/Akemid/portfolio-agent/pull/4
        commits:
          - a3a4add feat(domain): add chat request/answer/session models and domain errors
          - 02b5690 feat(domain): add derive_key hashing utility
          - d04d50e feat(ports): add SessionStore, RateLimiter, AgentClient, Clock, Ids protocols
          - 2bcbbb8 test(fakes): add in-memory port fakes for session store, rate limiter, agent client, clock
          - 2ab3e3d refactor(domain,ports): tighten docstrings to fit PR2a's review budget
          - 49a138d test(domain): narrow model tests to required scenarios, drop fakes smoke test
          - c4219c9 fix(domain): exclude session id from Session repr to keep it out of logs
        tasks_completed: ["2.1", "2.2", "2.3", "2.4", "2.5"]
        cut: >-
          PR2a = tasks 2.1-2.5 (models/errors/hashing/ports/fakes), exactly the
          split point tasks.md's own 2.G gate names. PR2b = tasks 2.6 (session
          identity domain logic) + 2.7 (cookie attribute builder) + 2.R
          (refactor) + 2.G (review gate).
        diff_stat: 19 files changed, 374 insertions(+) (git diff --stat main..feat/domain-core-a, excludes uv.lock)
        local_gate: >-
          ruff check clean, ruff format clean, mypy src clean, 31 tests pass,
          coverage 100% on the touched modules (--cov=src --cov-fail-under=85).
        note: >-
          Strict TDD followed throughout (RED confirmed by ImportError before
          each GREEN implementation). 2.1/2.2 share one RED cycle because
          ChatRequest's validation raises ValidationError, so domain/errors.py
          had to exist before domain/models.py's test could even collect.
          Deviated from the orchestrator's initial line budget: first pass
          measured 516 changed lines; trimmed non-mandated smoke tests and
          docstrings down to 374 (tasks.md's own 2.5 note says fakes need "No
          RED... exercised by 2.6 and Phase 4 tests", so the extra fakes
          smoke test was dropped, not the fakes themselves). Open as PR #4
          against main, reviewed (code APPROVE, security PASS after fixing a
          MEDIUM: Session repr leaked the session id, fixed with
          field(repr=False)), awaiting owner merge.
      - pr: PR2b
        branch: feat/domain-core-b
        base: feat/domain-core-a
        scope: >-
          Phase 2 second half — session identity domain logic
          (decide_session), the session cookie builder/parser, plus three
          items carried from PR2a's review: the dropped fakes smoke test, a
          tz-aware guard on Session.issued_at, and a [tool.pyright] editor
          config.
        status: pr_open
        pr_url: https://github.com/Akemid/portfolio-agent/pull/5
        commits:
          - ec602a6 fix(domain): reject naive issued_at on Session
          - cd6d2f4 feat(domain): add decide_session for session identity
          - ec34b01 feat(http): add session cookie builder and parser
          - cedd82f test(fakes): add behavioral smoke tests for port fakes
          - 2dc5b08 chore(config): add pyright extraPaths for editor import resolution
        tasks_completed: ["2.6", "2.7", "2.R"]
        diff_stat: >-
          9 files changed, 353 insertions(+) (git diff --stat
          feat/domain-core-a..feat/domain-core-b, excludes uv.lock)
        local_gate: >-
          ruff check clean, ruff format clean, mypy src clean, 57 tests pass
          (up from 34 baseline), coverage 100% on the touched modules
          (--cov=src --cov-fail-under=85).
        note: >-
          Strict TDD followed throughout: each production module was preceded
          by a RED run (ImportError, or an explicit "DID NOT RAISE" failure
          for the Session naive-datetime guard) before its GREEN
          implementation. decide_session's GREEN step already called
          derive_key("db", ...) from 2.3, so task 2.R found no duplicated
          hashing to extract; it did find a duplicated session-id
          shape-validation regex between 2.6 and 2.7, extracted to
          session_identity.is_valid_session_id_shape and imported by
          http/cookies.py. Cross-test-package imports (tests/unit/... ->
          tests/fakes/...) resolve as `from fakes.x import Y`, not
          `tests.fakes.x`, because pytest's rootdir-insertion treats `tests/`
          itself as the inserted sys.path entry (no tests/__init__.py exists);
          this is now the established pattern for reusing fakes across test
          modules. Session id shape validation (charset
          `[A-Za-z0-9_-]{22,128}`) is a local design choice, not spec-mandated
          text -- it matches `secrets.token_urlsafe(32)` output and rejects
          cookie-injected garbage before any store lookup. Task 2.G (fresh
          security-review + code review) is intentionally NOT checked off --
          it is a merge gate performed outside apply, not an implementation
          task.
      - pr: PR3a
        branch: feat/dynamodb-adapters
        base: feat/domain-core-b
        scope: >-
          Phase 3 first half — DynamoDB-backed SessionStore adapter
          (src/api/adapters/dynamo_session_store.py), the production Clock
          (system_clock.py) and Ids (secure_ids.py) adapters it depends on,
          and a shared moto table-schema helper
          (tests/helpers/dynamodb_schema.py) for PR3b and PR7 to reuse.
        status: pr_open
        pr_url: https://github.com/Akemid/portfolio-agent/pull/6
        commits:
          - 3a9246f feat(adapters): add DynamoDB session store with system clock and secure ids
          - 3918147 refactor(session): make SessionStore.get return SessionRecord so session_id is always the raw id
          - 8d60ec3 refactor(adapters): single-source DynamoDB key shape in dynamo_keys
        tasks_completed: ["3.1"]
        cut: >-
          PR3 (tasks.md Phase 3) = 3.1 (session store) + 3.2/3.3 (rate
          limiter). The 3.1 diff alone is 308 changed lines; adding the rate
          limiter's two counters (~290 more estimated) would exceed the
          ~400-line review budget, so this apply batch stops after 3.1 as
          PR3a. PR3b (tasks 3.2 session daily cap, 3.3 IP sliding window,
          3.G gate) is the next apply batch, stacked on feat/dynamodb-adapters.
        diff_stat: >-
          20 files changed, 473 insertions(+), 16 deletions(-) (git diff
          --stat feat/domain-core-b..feat/dynamodb-adapters, excludes
          uv.lock; grew from the initial 10-file/308-line 3.1 commit after
          the SessionStore.get contract fix and dynamo_keys extraction)
        local_gate: >-
          ruff check clean, ruff format clean, mypy src clean, 75 tests pass
          (up from 61 baseline; 72 after the initial 3.1 commit).
        note: >-
          Strict TDD followed throughout (RED confirmed by
          ModuleNotFoundError before each GREEN implementation). Follow-up
          fix (PR3 code review): the original "hashed id in
          Session.session_id" deviation below was WRONG -- create() and the
          fake returned Session.session_id as the RAW id while get()
          returned it as the HASH, so a caller deriving keys from
          session.session_id would get different keys for a new vs. reused
          session. Decision: SessionStore.get returns SessionRecord
          (issued_at only, no id field at all) instead of a Session with a
          fabricated id; decide_session reconstructs the reused Session
          from the raw cookie_value, so session_id always holds the raw id
          on both paths. DynamoSessionStore.get() now returns SessionRecord
          and the key-shape literals (pk/sk, SESSION# prefix, META, ttl)
          were extracted into src/api/adapters/dynamo_keys.py, imported by
          both the adapter and tests/helpers/dynamodb_schema.py. PR3b's
          rate limiter (tasks 3.2/3.3) MUST import dynamo_keys instead of
          re-declaring the key literals. Original (now superseded) note:
          design.md SS4.2 states the raw session id is never written to
          DynamoDB, so DynamoSessionStore.get() cannot return the
          caller-supplied raw id on the Session it produces -- it returns
          the hashed id in Session.session_id instead, documented in the
          adapter's docstring and asserted by a dedicated test
          (test_get_never_returns_or_stores_the_raw_session_id). No code
          reads session_id off a *fetched* session, so this is safe: the
          HTTP layer (Phase 4) already holds the raw cookie value it
          looked up with. Not yet opened as a PR (no push/PR in this batch,
          per the apply instructions).
      - pr: PR3b
        branch: feat/dynamodb-rate-limiter
        base: feat/dynamodb-adapters
        scope: >-
          Phase 3 second half — DynamoDB-backed RateLimiter adapter
          (src/api/adapters/dynamo_rate_limiter.py): per-session daily cap
          (task 3.2) and per-IP weighted sliding-window minute cap (task
          3.3), plus two new key-shape helpers in dynamo_keys.py (ip_pk,
          session_day_sk, ip_minute_sk).
        status: implemented_pending_review
        commits:
          - f91025c feat(adapters): add IP and session-day key helpers to dynamo_keys
          - a0e665d "feat(adapters): implement DynamoDB rate limiter (session cap + IP window)"
        tasks_completed: ["3.2", "3.3"]
        cut: >-
          PR3b = tasks 3.2 (session daily cap) + 3.3 (IP sliding window) +
          3.G (merge gate, intentionally left unchecked — it is a review
          gate, not an implementation task). Stacked on feat/dynamodb-adapters
          (PR3a, open as PR #6), per tasks.md's own split note.
        diff_stat: >-
          4 files changed, 464 insertions(+) (git diff --stat
          feat/dynamodb-adapters..feat/dynamodb-rate-limiter, excludes
          uv.lock)
        local_gate: >-
          ruff check clean, ruff format clean, mypy src clean, 91 tests pass
          (up from 75 baseline), coverage 100% on the touched modules
          (--cov=src --cov-fail-under=85).
        note: >-
          Strict TDD followed throughout (RED confirmed by
          ModuleNotFoundError/ImportError before each GREEN implementation);
          both the session cap and the IP window passed their full test
          suite on the first GREEN attempt, no fix-forward cycle needed.
          Imported PARTITION_KEY/SORT_KEY/TTL_ATTRIBUTE from dynamo_keys.py
          per the PR3a carried-forward instruction, never re-declaring the
          "pk"/"sk"/"ttl" literals.

          Check order: IP checked first, then session -- a single IP counter
          stops one attacker regardless of how many session cookies they
          forge, so a denied IP request never touches the session counter
          (asserted by
          test_ip_denial_does_not_increment_the_session_counter).

          IP algorithm: design.md SS4.2 explicitly rejects a plain
          fixed-minute bucket (it permits up to 2x the limit across a
          minute boundary) in favor of a weighted sliding window: a single
          Query reads the previous minute's bucket, computes
          estimate = prev_count * (1 - elapsed_fraction) + curr_count, and
          the current bucket's conditional UpdateItem is checked against a
          threshold derived from that estimate
          (derived_limit = limit - prev_weight) rather than against the
          raw configured limit. Regression test
          test_fixed_minute_boundary_burst_is_still_blocked proves this:
          after 5 requests fill the previous minute, only one extra request
          leaks through right after the boundary (the unavoidable
          attribute_not_exists(#c) escape needed to let a brand-new bucket
          ever be born, since DynamoDB's ConditionExpression grammar has no
          if_not_exists-style function -- that only exists in
          UpdateExpression), then the next request in the new bucket is
          blocked -- unlike a naive fixed-window reset, which would grant a
          fresh 5.

          TTL grace: session counter TTL = next 00:00 UTC + 300s; IP bucket
          TTL = bucket start + 180s (design.md SS4.2's own table values).
          Both are set via `if_not_exists` in the same UpdateExpression as
          the ADD, so a TTL is written once per item and never overwritten
          on subsequent increments (asserted by
          test_session_ttl_is_end_of_day_plus_grace_and_set_only_once).

          No rollback on agent failure (v1): neither counter is
          decremented if the agent invocation fails after being invoked --
          documented in the adapter's module docstring as a deliberate
          simplicity/safety tradeoff (single atomic write per scope, no
          compensating transaction) accepted at this project's scale.

          Atomicity: exactly one update_item call per scope per
          check_and_increment, asserted with a counting proxy wrapping the
          moto table
          (test_check_and_increment_issues_exactly_one_update_item_call_per_scope).

          Deviation from the orchestrator's suggested port shape: the
          existing RateLimiter.check_and_increment(session_key, ip_key)
          port (already hashed keys, unchanged from PR2a) was kept as-is --
          no port change was needed. Deviation from the orchestrator's
          suggested condition shape: task 3.2/3.3 in tasks.md (the
          authoritative task breakdown) specify a conditional UpdateItem
          with attribute_not_exists(#c) OR #c < :limit, not the simpler
          always-succeeds-then-compare-count pattern in the initial apply
          prompt; tasks.md/design.md were followed since they are the
          project's source of truth. IAM: the Lambda's execution role now
          also needs dynamodb:Query in addition to GetItem/PutItem/UpdateItem
          (session store already needed the latter two) -- required for the
          IP window's read of the previous minute's bucket.
