[project]
name = "portfolio-agent"
version = "0.1.0"
description = "Portfolio CV chatbot on Amazon Bedrock AgentCore"
authors = [
    { name = "Sergio Mondragon", email = "sergiomondragondev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.90",
]

[dependency-groups]
# What the Lambda zip (`src/api`) needs on top of the runtime `dependencies`
# above: nothing — `boto3` alone. Kept as its own group (rather than folded
# into `dev`) so `uv export --group agent`/`--group infra` never pull it in
# by accident; `test_lambda_package_isolation.py` is the enforcing test.
agent = [
    "strands-agents==1.55.0",
    "bedrock-agentcore==1.22.0",
]
infra = [
    "aws-cdk-lib==2.268.0",
    "constructs==10.8.1",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "moto[dynamodb]==5.2.3",
    "pyyaml==6.0.3",
    "pip-audit==2.10.1",
    "types-pyyaml==6.0.12.20260906",
    "boto3-stubs[bedrock-agentcore,dynamodb]==1.43.94",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pyright]
pythonVersion = "3.12"
extraPaths = ["src", "tests", "."]
