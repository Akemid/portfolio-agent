[project]
name = "portfolio-agent"
version = "0.1.0"
description = "Portfolio CV chatbot on Amazon Bedrock AgentCore"
authors = [
    { name = "Sergio Mondragon", email = "sergiomondragondev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.90",
    "aws-cdk-lib==2.268.0",
    "constructs==10.8.1",
    "strands-agents==1.55.0",
    "bedrock-agentcore==1.22.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "moto[dynamodb]==5.2.3",
    "pyyaml==6.0.3",
    "pip-audit==2.10.1",
    "types-pyyaml==6.0.12.20260906",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
