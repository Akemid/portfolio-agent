name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Tests with coverage gate
        run: uv run pytest --cov=src --cov-fail-under=85

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Secret scan (gitleaks)
        run: gitleaks detect --no-git -v

      - name: Dependency scan (pip-audit)
        run: uv run pip-audit

      - name: Content guard — no personal content in the diff
        run: |
          git diff --unified=0 "origin/${{ github.event.pull_request.base.ref || 'main' }}"...HEAD > pr.diff || true
          bash scripts/check_no_content.sh pr.diff

      - name: CDK synth
        # Skipped until infra/app.py exists (added in PR7 — CDK DataStack).
        # See openspec/changes/agentcore-migration-v1/tasks.md, Phase 7.
        run: |
          if [ -f infra/app.py ]; then
            uv run cdk synth --all
          else
            echo "Skipping cdk synth: infra/app.py not yet added (see PR7)."
          fi
