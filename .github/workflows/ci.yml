name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v4 (pinned by commit SHA for supply-chain safety)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install uv
        # astral-sh/setup-uv v3 (pinned by commit SHA for supply-chain safety)
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Tests with coverage gate
        run: uv run pytest --cov=src --cov-fail-under=85

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
          GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          sudo tar -xz -C /usr/local/bin -f gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Secret scan (gitleaks, full git history, redacted output)
        run: gitleaks detect --source . --redact -v

      - name: Dependency scan (pip-audit)
        run: uv run pip-audit

      - name: Content guard — no personal content in the diff
        run: |
          git diff --unified=0 "origin/${{ github.event.pull_request.base.ref || 'main' }}"...HEAD > pr.diff || true
          bash scripts/check_no_content.sh pr.diff

      - name: Build placeholder deployment zips for cdk synth
        # AgentStack/ApiStack (infra/stacks/agent_stack.py, api_stack.py) need a
        # real file on disk at AGENT_ZIP_PATH/LAMBDA_ZIP_PATH — cdk synth only
        # references the file for the S3 asset, it never installs or runs it,
        # so a tiny fixture zip is enough (same pattern already used by
        # tests/unit/infra/test_app_synth.py). This avoids running
        # scripts/build_agent.sh / scripts/build_lambda.sh's arm64 wheel
        # install in CI, which needs network access and adds minutes per run.
        run: |
          mkdir -p build
          uv run python -c "import zipfile; zipfile.ZipFile('build/agent.zip', 'w').writestr('main.py', '')"
          uv run python -c "import zipfile; zipfile.ZipFile('build/lambda.zip', 'w').writestr('api/__init__.py', '')"

      - name: CDK synth (cdk synth against a neutralized fake AWS account)
        # Never touches real AWS: CDK_DEFAULT_ACCOUNT is the CDK-documented
        # placeholder account, the AWS credential files/env vars are
        # neutralized, and --no-lookups disables any context lookup that
        # would otherwise need real credentials (gotcha: the aws-cdk@2 CLI's
        # own STS-resolved account can override CDK_DEFAULT_ACCOUNT for a
        # construct that needs a concrete account, e.g. aws_s3_assets.Asset,
        # unless the credential files/vars are also cleared).
        #
        # Uses `npx aws-cdk@2`, never bare `npx cdk` — the unscoped `cdk`
        # package on npm is an unrelated tool and silently prints its own
        # version instead of running the AWS CDK CLI. ubuntu-latest ships a
        # current Node.js/npx already, so no separate Node setup step is
        # added here.
        env:
          AWS_CONFIG_FILE: /dev/null
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
          AWS_ACCESS_KEY_ID: "x"
          AWS_SECRET_ACCESS_KEY: "x"
          AWS_SESSION_TOKEN: ""
          AWS_PROFILE: ""
          CDK_DEFAULT_ACCOUNT: "000000000000"
          CDK_DEFAULT_REGION: "us-east-1"
          AGENT_ZIP_PATH: build/agent.zip
          LAMBDA_ZIP_PATH: build/lambda.zip
        run: |
          # cdk synth via npx aws-cdk@2 (see the step name/comment above for why).
          npx --yes aws-cdk@2 synth --all --no-lookups --quiet
